<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="theme-color" content="#09090f" />
  <title>靈感筆記</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    * { -webkit-tap-highlight-color: transparent; box-sizing: border-box; }
    body { background: #09090f; overscroll-behavior: none; }
    textarea, input { font-size: 16px !important; }
    .no-sb::-webkit-scrollbar { display: none; }
    .no-sb { -ms-overflow-style: none; scrollbar-width: none; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .spin { animation: spin .9s linear infinite; }
    textarea:focus, input:focus { outline: none; }
  </style>
</head>
<body class="text-gray-100">
<div id="app" class="max-w-lg mx-auto min-h-screen flex flex-col"></div>

<script>
// ── STATE ──────────────────────────────────────────
let S = {
  vault:  '',
  folder: 'Inbox',
  apiKey: '',
  notes:  []  // { id, title, transcript, timestamp, savedDaily, savedNew }
};

let UI = {
  showSettings:  false,
  processing:    false,
  editingId:     null,
  pendingTranscript: '',
  pendingTitle:  '',
  step: 'input'   // 'input' | 'confirm'
};

function load() {
  try {
    const d = JSON.parse(localStorage.getItem('fn-v3') || '{}');
    S.vault   = d.vault   || '';
    S.folder  = d.folder  || 'Inbox';
    S.apiKey  = d.apiKey  || '';
    S.notes   = d.notes   || [];
  } catch(e) {}
}

function save() {
  localStorage.setItem('fn-v3', JSON.stringify(S));
}

// ── GPT TITLE ──────────────────────────────────────
async function generateTitle(text) {
  const fallback = text.replace(/\s+/g,' ').trim().slice(0, 15);
  if (!S.apiKey) return fallback;
  try {
    const r = await fetch('https://api.openai.com/v1/chat/completions', {
      method: 'POST',
      headers: { 'Authorization': `Bearer ${S.apiKey}`, 'Content-Type': 'application/json' },
      body: JSON.stringify({
        model: 'gpt-4o-mini',
        messages: [{ role: 'user',
          content: `請為以下語音筆記生成一個精簡標題（10字以內，不加標點符號，直接輸出標題文字）：\n\n${text}` }],
        max_tokens: 30, temperature: 0.5
      })
    });
    if (!r.ok) return fallback;
    return (await r.json()).choices?.[0]?.message?.content?.trim() || fallback;
  } catch { return fallback; }
}

// ── OBSIDIAN URI ───────────────────────────────────
const fmtDate = iso => iso.slice(0,10);
const fmtTime = iso => new Date(iso).toTimeString().slice(0,5);

function dailyMD(note) {
  return `\n## ${fmtTime(note.timestamp)} · ${note.title}\n\n${note.transcript}\n\n---\n`;
}
function singleMD(note) {
  return `---\ntitle: ${note.title}\ndate: ${fmtDate(note.timestamp)} ${fmtTime(note.timestamp)}\ntags:\n  - fleeting\n  - voice-note\n---\n\n${note.transcript}\n`;
}
function singleName(note) {
  return `${fmtDate(note.timestamp)}-${fmtTime(note.timestamp).replace(':','')} ${note.title}`;
}

function obsidianAppend(note) {
  const fp = `${S.folder.replace(/\/$/,'')}/${fmtDate(note.timestamp)}.md`;
  location.href = `obsidian://advanced-uri?vault=${enc(S.vault)}&filepath=${enc(fp)}&data=${enc(dailyMD(note))}&mode=append`;
}
function obsidianNew(note) {
  const name = `${S.folder.replace(/\/$/,'')}/${singleName(note)}`;
  location.href = `obsidian://new?vault=${enc(S.vault)}&name=${enc(name)}&content=${enc(singleMD(note))}`;
}
function enc(s) { return encodeURIComponent(s || ''); }

// ── ACTIONS ────────────────────────────────────────
async function handleSubmit() {
  const ta = document.getElementById('transcript-input');
  const text = ta ? ta.value.trim() : '';
  if (!text) { toast('請先貼上轉錄文字'); return; }
  UI.processing = true;
  UI.pendingTranscript = text;
  render();
  UI.pendingTitle = await generateTitle(text);
  const note = {
    id:         Date.now(),
    title:      UI.pendingTitle,
    transcript: UI.pendingTranscript,
    timestamp:  new Date().toISOString(),
    savedDaily: false,
    savedNew:   false
  };
  S.notes.unshift(note);
  save();
  UI.processing  = false;
  UI.step        = 'input';
  UI.pendingTranscript = '';
  render();
  toast('✓ 已生成標題');
}

function doSaveDaily(id) {
  const n = S.notes.find(x => x.id === id);
  if (!n) return;
  if (!S.vault) { toast('請先在設定中填寫 Vault 名稱'); return; }
  obsidianAppend(n);
  n.savedDaily = true; save();
  setTimeout(render, 500);
}
function doSaveNew(id) {
  const n = S.notes.find(x => x.id === id);
  if (!n) return;
  if (!S.vault) { toast('請先在設定中填寫 Vault 名稱'); return; }
  obsidianNew(n);
  n.savedNew = true; save();
  setTimeout(render, 500);
}
function doCopy(id) {
  const n = S.notes.find(x => x.id === id);
  if (!n) return;
  navigator.clipboard.writeText(singleMD(n))
    .then(() => toast('✓ 已複製'))
    .catch(() => toast('複製失敗'));
}
function doDownload(id) {
  const n = S.notes.find(x => x.id === id);
  if (!n) return;
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([singleMD(n)], { type: 'text/markdown' }));
  a.download = singleName(n) + '.md';
  a.click();
}
function doDelete(id) {
  S.notes = S.notes.filter(x => x.id !== id); save(); render();
}
function startEdit(id) {
  UI.editingId = id; render();
  setTimeout(() => {
    const el = document.getElementById('te-' + id);
    if (el) { el.focus(); el.select(); }
  }, 40);
}
function commitEdit(id) {
  const el = document.getElementById('te-' + id);
  const n  = S.notes.find(x => x.id === id);
  if (el && n) n.title = el.value.trim() || n.title;
  UI.editingId = null; save(); render();
}
function clearSaved() {
  S.notes = S.notes.filter(n => !(n.savedDaily && n.savedNew)); save(); render();
}
function saveSettings() {
  const v = document.getElementById('s-vault');
  const f = document.getElementById('s-folder');
  const k = document.getElementById('s-api');
  if (v) S.vault   = v.value.trim();
  if (f) S.folder  = f.value.trim() || 'Inbox';
  if (k) S.apiKey  = k.value.trim();
  save(); UI.showSettings = false; render(); toast('✓ 設定已儲存');
}

// ── TOAST ──────────────────────────────────────────
let _tt;
function toast(msg) {
  clearTimeout(_tt);
  let el = document.getElementById('_toast');
  if (!el) {
    el = document.createElement('div');
    el.id = '_toast';
    el.className = 'fixed bottom-20 left-1/2 -translate-x-1/2 z-50 px-4 py-2 rounded-full text-sm font-medium bg-gray-700 text-white shadow-xl pointer-events-none';
    document.body.appendChild(el);
  }
  el.textContent = msg;
  el.style.opacity = '1';
  _tt = setTimeout(() => { el.style.opacity = '0'; }, 2200);
}

// ── RENDER ─────────────────────────────────────────
function render() {
  const app = document.getElementById('app');
  const pending = S.notes.filter(n => !n.savedDaily || !n.savedNew).length;
  const hasSaved = S.notes.some(n => n.savedDaily && n.savedNew);

  app.innerHTML = `
    ${headerHTML()}
    <div class="flex-1 overflow-y-auto no-sb px-4 pb-8 space-y-4">
      ${inputAreaHTML()}
      ${S.notes.length > 0 ? notesHTML(pending, hasSaved) : emptyHTML()}
    </div>
    ${UI.showSettings ? settingsHTML() : ''}
  `;
}

function headerHTML() {
  return `
  <header class="flex items-center justify-between px-4 py-3 border-b border-white/5 sticky top-0 bg-[#09090f]/95 backdrop-blur-md z-10">
    <h1 class="text-base font-semibold text-white tracking-tight">靈感筆記</h1>
    <button onclick="UI.showSettings=true;render()"
      class="p-2 rounded-xl bg-white/5 hover:bg-white/10 transition-all">
      <svg class="w-5 h-5 text-gray-400" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.8">
        <path stroke-linecap="round" stroke-linejoin="round"
          d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"/>
        <path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/>
      </svg>
    </button>
  </header>`;
}

function inputAreaHTML() {
  if (UI.processing) return `
  <div class="flex flex-col items-center py-10 gap-3">
    <svg class="spin w-8 h-8 text-indigo-500" fill="none" viewBox="0 0 24 24">
      <circle class="opacity-20" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="3"/>
      <path class="opacity-80" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4z"/>
    </svg>
    <p class="text-sm text-gray-500">正在生成標題⋯</p>
  </div>`;

  return `
  <div class="mt-4 space-y-3">
    <textarea id="transcript-input"
      placeholder="貼上轉錄文字⋯"
      rows="5"
      class="w-full bg-white/[0.04] border border-white/[0.08] focus:border-indigo-500/60
             text-white placeholder-gray-600 rounded-2xl px-4 py-3.5 text-sm leading-relaxed
             resize-none transition-colors no-sb"
    >${esc(UI.pendingTranscript)}</textarea>
    <button onclick="handleSubmit()"
      class="w-full bg-indigo-600 hover:bg-indigo-500 active:scale-98 text-white font-semibold
             py-3.5 rounded-2xl text-sm transition-all shadow-lg shadow-indigo-500/20">
      生成標題並存到 Obsidian
    </button>
  </div>`;
}

function notesHTML(pending, hasSaved) {
  return `
  <div class="space-y-3 mt-2">
    <div class="flex items-center justify-between px-0.5">
      <span class="text-xs text-gray-600 font-medium">
        ${pending > 0 ? `${pending} 筆待存` : '全部已存 ✓'}
      </span>
      ${hasSaved ? `<button onclick="clearSaved()" class="text-xs text-gray-700 hover:text-gray-500 transition-colors">清除已存</button>` : ''}
    </div>
    ${S.notes.map(noteHTML).join('')}
  </div>`;
}

function noteHTML(n) {
  const allSaved = n.savedDaily && n.savedNew;
  const today    = fmtDate(new Date().toISOString());
  const dateLabel = fmtDate(n.timestamp) === today
    ? `今天 ${fmtTime(n.timestamp)}`
    : `${fmtDate(n.timestamp)} ${fmtTime(n.timestamp)}`;
  const hasVault = S.vault.trim() !== '';

  return `
  <div class="bg-white/[0.03] border ${allSaved ? 'border-green-900/40 opacity-60' : 'border-white/[0.07]'} rounded-2xl p-4 transition-opacity">
    <div class="flex items-center justify-between mb-2">
      <span class="text-xs text-gray-600">${dateLabel}</span>
      <div class="flex items-center gap-2">
        ${n.savedDaily ? '<span class="text-xs text-green-700 bg-green-900/30 px-1.5 py-0.5 rounded-full">📅 ✓</span>' : ''}
        ${n.savedNew   ? '<span class="text-xs text-green-700 bg-green-900/30 px-1.5 py-0.5 rounded-full">📄 ✓</span>' : ''}
        <button onclick="doDelete(${n.id})" class="text-gray-800 hover:text-red-500 transition-colors p-0.5">
          <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
            <path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12"/>
          </svg>
        </button>
      </div>
    </div>

    ${UI.editingId === n.id ? `
      <input id="te-${n.id}" type="text" value="${esc(n.title)}"
        class="w-full bg-white/5 border border-indigo-500/60 text-white font-semibold text-sm
               px-2 py-1 rounded-xl mb-2 outline-none"
        onkeydown="if(event.key==='Enter')commitEdit(${n.id})"
        onblur="commitEdit(${n.id})" />
    ` : `
      <h3 onclick="startEdit(${n.id})"
        class="font-semibold text-sm text-white mb-2 leading-snug cursor-pointer hover:text-indigo-400 transition-colors">
        ${esc(n.title)} <span class="text-gray-700 text-xs font-normal ml-0.5">✎</span>
      </h3>
    `}

    <p class="text-gray-400 text-sm leading-relaxed mb-3">${esc(n.transcript)}</p>

    ${!hasVault ? `
      <div class="text-xs text-amber-600/80 bg-amber-900/20 border border-amber-800/40 px-3 py-2 rounded-xl">
        ⚠️ 請先在設定中填寫 Obsidian Vault 名稱
      </div>
    ` : `
      <div class="flex flex-wrap gap-2">
        <button onclick="doSaveDaily(${n.id})"
          class="px-3 py-1.5 rounded-xl text-xs font-medium transition-all
                 ${n.savedDaily ? 'bg-green-900/30 text-green-600 cursor-default' : 'bg-indigo-600/15 hover:bg-indigo-600/25 text-indigo-400'}">
          📅 ${n.savedDaily ? '日誌已存' : '加入今日日誌'}
        </button>
        <button onclick="doSaveNew(${n.id})"
          class="px-3 py-1.5 rounded-xl text-xs font-medium transition-all
                 ${n.savedNew ? 'bg-green-900/30 text-green-600 cursor-default' : 'bg-purple-600/15 hover:bg-purple-600/25 text-purple-400'}">
          📄 ${n.savedNew ? '檔案已存' : '存為新檔案'}
        </button>
        <button onclick="doCopy(${n.id})"
          class="px-3 py-1.5 rounded-xl text-xs font-medium bg-white/5 hover:bg-white/10 text-gray-400 transition-all">
          📋 複製
        </button>
        <button onclick="doDownload(${n.id})"
          class="px-3 py-1.5 rounded-xl text-xs font-medium bg-white/5 hover:bg-white/10 text-gray-400 transition-all">
          ⬇️ 下載
        </button>
      </div>
    `}
  </div>`;
}

function emptyHTML() {
  return `
  <div class="text-center py-6">
    <p class="text-gray-700 text-sm">還沒有筆記</p>
    <p class="text-gray-800 text-xs mt-1">貼上轉錄文字，開始記錄</p>
  </div>`;
}

function settingsHTML() {
  return `
  <div class="fixed inset-0 z-40 bg-black/70 backdrop-blur-sm flex items-end"
       onclick="if(event.target===this){UI.showSettings=false;render()}">
    <div class="w-full max-h-[88vh] overflow-y-auto no-sb bg-[#111118]
                border-t border-white/10 rounded-t-3xl">
      <div class="sticky top-0 bg-[#111118] pt-5 px-5 pb-4 border-b border-white/5
                  flex items-center justify-between z-10">
        <h2 class="text-base font-semibold text-white">設定</h2>
        <button onclick="UI.showSettings=false;render()"
          class="p-1.5 rounded-full bg-white/5 hover:bg-white/10 transition-all">
          <svg class="w-4 h-4 text-gray-400" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
            <path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12"/>
          </svg>
        </button>
      </div>

      <div class="px-5 py-5 space-y-4">

        <div>
          <label class="block text-xs font-semibold text-gray-400 uppercase tracking-wide mb-1.5">
            Obsidian Vault 名稱
          </label>
          <input id="s-vault" type="text" value="${esc(S.vault)}" placeholder="My Second Brain"
            class="w-full bg-white/5 border border-white/10 focus:border-indigo-500/60
                   text-white rounded-xl px-3 py-2.5 text-sm transition-colors" />
          <p class="text-xs text-gray-600 mt-1">需與 Obsidian 中的 Vault 名稱完全一致</p>
        </div>

        <div>
          <label class="block text-xs font-semibold text-gray-400 uppercase tracking-wide mb-1.5">
            Inbox 資料夾路徑
          </label>
          <input id="s-folder" type="text" value="${esc(S.folder)}" placeholder="Inbox"
            class="w-full bg-white/5 border border-white/10 focus:border-indigo-500/60
                   text-white rounded-xl px-3 py-2.5 text-sm transition-colors" />
          <p class="text-xs text-gray-600 mt-1">例：<code class="text-gray-500">Inbox</code>　或　<code class="text-gray-500">00 Inbox/Voice</code></p>
        </div>

        <div>
          <label class="block text-xs font-semibold text-gray-400 uppercase tracking-wide mb-1.5">
            OpenAI API Key　<span class="normal-case font-normal text-gray-600">（標題生成用）</span>
          </label>
          <input id="s-api" type="password" value="${esc(S.apiKey)}" placeholder="sk-..."
            class="w-full bg-white/5 border border-white/10 focus:border-indigo-500/60
                   text-white rounded-xl px-3 py-2.5 text-sm transition-colors" />
          <p class="text-xs text-gray-600 mt-1">留空則自動取前 15 字為標題。儲存於本機，不外傳。</p>
        </div>

        <button onclick="saveSettings()"
          class="w-full bg-indigo-600 hover:bg-indigo-500 text-white font-semibold
                 py-3.5 rounded-2xl text-sm transition-all active:scale-98">
          儲存設定
        </button>

        <div class="border-t border-white/5 pt-4 space-y-3">
          <h3 class="text-sm font-semibold text-gray-300">⚠️「加入今日日誌」需要外掛</h3>
          <p class="text-xs text-gray-500 leading-relaxed">
            此功能使用 Obsidian 社群外掛 <strong class="text-gray-400">Advanced URI</strong>，
            可將內容附加到當天的彙整檔（如 <code class="text-gray-500">Inbox/2025-06-04.md</code>）。<br><br>
            「存為新檔案」不需要任何外掛。
          </p>
        </div>

        <div class="pb-6"></div>
      </div>
    </div>
  </div>`;
}

// ── UTILS ──────────────────────────────────────────
function esc(s) {
  return String(s ?? '')
    .replace(/&/g,'&amp;').replace(/</g,'&lt;')
    .replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}

// ── INIT ───────────────────────────────────────────
load();
render();

// Focus textarea on load
window.addEventListener('load', () => {
  const ta = document.getElementById('transcript-input');
  if (ta) ta.focus();
});
</script>
</body>
</html>
